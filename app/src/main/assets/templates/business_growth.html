<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07131d;font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center}.wrap{width:78%;}.label{font-size:28px;letter-spacing:5px;opacity:.7}.title{font-size:88px;font-weight:800;margin-top:20px}.line{height:10px;border-radius:8px;background:#1d3948;margin-top:30px;overflow:hidden}.fill{height:100%;width:20%;background:linear-gradient(90deg,#45e6c4,#fff36b);animation:g 6s linear infinite}.dot{width:22px;height:22px;border-radius:50%;background:#fff36b;box-shadow:0 0 35px 10px #fff36b;position:fixed;right:12%;top:24%;animation:d 4s ease-in-out infinite alternate}@keyframes g{to{width:96%}}@keyframes d{to{transform:translate(-180px,310px) scale(1.7)}}
</style></head><body><div class="wrap"><div class="label">BUSINESS</div><div class="title">Growth</div><div class="line"><div class="fill"></div></div></div><div class="dot"></div></body></html>
