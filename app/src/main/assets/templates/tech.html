<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#03060a;color:#eaffff;font-family:Arial,sans-serif}body{display:grid;place-items:center}.grid{position:fixed;inset:-20%;background:linear-gradient(rgba(58,255,235,.08) 1px,transparent 1px),linear-gradient(90deg,rgba(58,255,235,.08) 1px,transparent 1px);background-size:55px 55px;transform:perspective(480px) rotateX(62deg) translateY(90px);animation:p 8s linear infinite}.orb{width:270px;height:270px;border-radius:50%;background:radial-gradient(circle at 35% 32%,#fff, #54ffe7 8%,#176dff 35%,#070b20 70%);box-shadow:0 0 90px #20e9ff;animation:o 5s ease-in-out infinite alternate}.txt{position:fixed;bottom:15%;text-align:center;letter-spacing:8px;font-size:28px;opacity:.8}@keyframes p{to{transform:perspective(480px) rotateX(62deg) translateY(145px)}}@keyframes o{to{transform:scale(1.15) rotate(18deg)}}
</style></head><body><div class="grid"></div><div class="orb"></div><div class="txt">TECHNOLOGY</div></body></html>
