<!doctype html><html><head><meta name="viewport" content="width=device-width,initial-scale=1"><style>
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:radial-gradient(circle at 50% 40%,#24315d,#080b18 68%);font-family:Arial,sans-serif;color:#fff}body{display:grid;place-items:center}.wrap{width:72%;text-align:center}.k{font-size:26px;letter-spacing:6px;opacity:.7}.v{font-size:82px;font-weight:800;margin:20px}.chart{height:260px;display:flex;align-items:flex-end;justify-content:space-between;gap:14px}.bar{flex:1;background:linear-gradient(#77f2ff,#6d52ff);border-radius:12px 12px 2px 2px;transform-origin:bottom;animation:b 2.5s ease-in-out infinite alternate}.bar:nth-child(1){height:35%;}.bar:nth-child(2){height:50%;animation-delay:.15s}.bar:nth-child(3){height:42%;animation-delay:.3s}.bar:nth-child(4){height:70%;animation-delay:.45s}.bar:nth-child(5){height:58%;animation-delay:.6s}.bar:nth-child(6){height:88%;animation-delay:.75s}.bar:nth-child(7){height:100%;animation-delay:.9s}@keyframes b{to{transform:scaleY(.78)}}
</style></head><body><div class="wrap"><div class="k">FINANCE</div><div class="v">Market Rise</div><div class="chart"><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i><i class="bar"></i></div></div></body></html>
